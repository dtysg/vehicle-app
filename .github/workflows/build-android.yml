name: 🤖 构建 Android APK

on:
  # 手动触发（在 GitHub App 里点按钮即可）
  workflow_dispatch:
    inputs:
      release_notes:
        description: '更新说明（选填）'
        required: false
        default: ''
  # 也可以推代码时自动触发
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    name: 构建 APK 并发布
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # 允许 push 版本号回 GitHub

    steps:
      # ── 1. 检出代码 ────────────────────────────────────
      - name: 📥 检出代码
        uses: actions/checkout@v4

      # ── 2. 环境：Java 17 ───────────────────────────────
      - name: ☕ 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. 环境：Node.js + pnpm ────────────────────────
      - name: 🟢 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ── 4. 安装依赖（带缓存）────────────────────────────
      - name: 📂 获取 pnpm store 路径
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 🗂️ 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 📦 安装依赖
        run: pnpm install --frozen-lockfile

      # ── 5. 写 .env（注入 Supabase 配置）───────────────
      - name: 🔑 写入环境变量
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_APP_ID=app-d6jn0ph0piwx" >> .env

      # ── 5.5 缓存 Gradle（加速后续构建）──────────────────
      # 注意：key 不能用 *.gradle* 文件哈希（expo prebuild --clean 每次重新生成 android/ 目录）
      # 改用 pnpm-lock.yaml + app.json 作为 key，这些文件稳定且能反映依赖变化
      - name: 🗄️ 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 5.6 缓存 Metro bundler ────────────────────────
      - name: ⚡ 缓存 Metro bundler
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.metro-cache
            ${{ github.workspace }}/node_modules/.cache
          key: metro-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: metro-${{ runner.os }}-

      # ── 5.7 计算新版本号并更新 app.json（必须在 prebuild 前）──
      - name: 📋 计算并写入版本号
        id: version
        run: |
          VERSION=$(node -e "const a=require('./app.json'); console.log(a.expo.version)")
          MAJOR=$(echo $VERSION | awk -F. '{print $1}')
          MINOR=$(echo $VERSION | awk -F. '{print $2}')
          PATCH=$(echo $VERSION | awk -F. '{print $3}')
          NEW_CODE=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_CODE}"
          echo "name=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "code=${NEW_CODE}"    >> $GITHUB_OUTPUT
          echo "APK 版本: ${NEW_VERSION} (code: ${NEW_CODE})"

          # 把新版本写入 app.json，让 APK 内嵌正确版本号
          node -e "
            const fs = require('fs');
            const a  = JSON.parse(fs.readFileSync('app.json'));
            a.expo.version = '${NEW_VERSION}';
            a.expo.android = a.expo.android || {};
            a.expo.android.versionCode = ${NEW_CODE};
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2) + '\n');
            console.log('✅ app.json 已更新 →', '${NEW_VERSION}');
          "

      # ── 6. Expo Prebuild（生成 android 原生工程）───────
      - name: 🛠️ Expo Prebuild
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm exec expo prebuild --platform android --clean

      # ── 7. 写入 keystore 文件 ──────────────────────────
      - name: 🔐 恢复 keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/vehicle-app.keystore

      # ── 9. Gradle 构建 Release APK ─────────────────────
      - name: 🔨 Gradle 构建 APK
        # 必须在此步骤注入 env，Gradle 调用 Metro 打包时才能读到 EXPO_PUBLIC_* 变量
        # 若只写 .env 文件，Gradle/Metro 不会自动读取，导致 Supabase 用 placeholder
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ID: app-d6jn0ph0piwx
        run: |
          cd android
          chmod +x gradlew
          # 增加 JVM 内存防止 OOM Metaspace，跳过 lint（不影响 APK 功能）
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC" >> gradle.properties
          ./gradlew assembleRelease --no-daemon --build-cache \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            -x lint

      # ── 10. 读取版本号（已在步骤 5.7 计算，这里只做复核日志）──
      - name: 📋 读取版本信息
        id: version_check
        run: |
          echo "✅ 版本确认: ${{ steps.version.outputs.name }} (code: ${{ steps.version.outputs.code }})"

      # ── 11. 上传 APK 到 Supabase Storage ──────────────
      - name: ☁️ 上传 APK 到 Supabase
        id: upload
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          VERSION_NAME="${{ steps.version.outputs.name }}"
          STORAGE_PATH="apk/vehicle-app-${VERSION_NAME}.apk"

          # 确认 APK 存在并打印大小
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK 文件不存在: $APK_PATH"
            ls android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "📦 APK 大小: ${APK_SIZE}，路径: ${APK_PATH}"

          # 上传（最多重试 3 次，PUT 方法覆盖同名文件，避免 409 Duplicate）
          # --max-time 900: 15分钟总超时（135M APK 实测需要 5-8 分钟）
          # --connect-timeout 60: 连接超时单独控制
          # --speed-limit 512 --speed-time 90: 90秒内速度低于 512B/s 视为卡死并中止
          MAX_RETRY=3
          for i in $(seq 1 $MAX_RETRY); do
            echo "🔄 上传尝试 $i/$MAX_RETRY ..."
            RESP=$(curl -s -w "\n%{http_code}" \
              --max-time 900 \
              --connect-timeout 60 \
              --speed-limit 512 --speed-time 90 \
              -X PUT \
              "${{ secrets.SUPABASE_URL }}/storage/v1/object/apk-releases/${STORAGE_PATH}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "x-upsert: true" \
              --data-binary @"$APK_PATH")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -1)
            echo "上传状态: $HTTP_CODE  响应: $BODY"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              break
            fi
            if [ $i -eq $MAX_RETRY ]; then
              echo "❌ 上传失败（重试 $MAX_RETRY 次后仍失败）"
              exit 1
            fi
            echo "⏳ 等待 30 秒后重试..."
            sleep 30
          done

          APK_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/apk-releases/${STORAGE_PATH}"
          echo "apk_url=${APK_URL}" >> $GITHUB_OUTPUT
          echo "✅ APK 上传成功: ${APK_URL}"

      # ── 12. 写入 app_versions 表 ──────────────────────
      - name: 📝 写入版本记录
        run: |
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="$(git log -1 --pretty=%s)"
          fi

          curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/app_versions" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{
              \"version_name\": \"${{ steps.version.outputs.name }}\",
              \"version_code\": ${{ steps.version.outputs.code }},
              \"apk_url\": \"${{ steps.upload.outputs.apk_url }}\",
              \"release_notes\": \"${NOTES}\",
              \"is_force\": false
            }"
          echo "✅ 版本记录写入完成"

      # ── 13. 保存 APK 产物 ──────────────────────────────
      - name: 💾 保存 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-app-${{ steps.version.outputs.name }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── 14. 构建完成通知 ───────────────────────────────
      - name: 🎉 构建完成
        run: |
          echo "================================================"
          echo "🎉 APK 构建发布成功！"
          echo "   版本：${{ steps.version.outputs.name }}"
          echo "   下载：${{ steps.upload.outputs.apk_url }}"
          echo "   App 内更新弹窗将在下次启动后自动弹出"
          echo "================================================"

      # ── 15. 把版本号回写到 GitHub（下次构建用）──────────
      - name: 🔖 回写版本号到 GitHub
        if: success()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add app.json
          if git diff --staged --quiet; then
            echo "⚠️ app.json 无变化，跳过回写"
          else
            git commit -m "ci: bump version to ${{ steps.version.outputs.name }} [skip ci]"
            # pull --rebase 合并远端新提交（避免并发推送冲突），再 push
            git pull --rebase origin main
            git push origin main
            echo "✅ app.json 版本已回写: ${{ steps.version.outputs.name }}"
          fi
