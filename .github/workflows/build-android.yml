name: 🤖 构建 Android APK

on:
  # 手动触发（在 GitHub App 里点按钮即可）
  workflow_dispatch:
    inputs:
      release_notes:
        description: '更新说明（选填）'
        required: false
        default: ''
  # 也可以推代码时自动触发
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    name: 构建 APK 并发布
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # 允许 push 版本号回 GitHub

    steps:
      # ── 1. 检出代码 ────────────────────────────────────
      - name: 📥 检出代码
        uses: actions/checkout@v4

      # ── 2. 环境：Java 17 ───────────────────────────────
      - name: ☕ 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. 环境：Node.js + pnpm ────────────────────────
      - name: 🟢 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ── 4. 安装依赖（直接缓存 node_modules，命中时跳过 install）──
      - name: 🗂️ 缓存 node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: nm-${{ runner.os }}-

      - name: 📦 安装依赖
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # ── 5. 写 .env（注入 Supabase 配置）───────────────
      - name: 🔑 写入环境变量
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_APP_ID=app-d6jn0ph0piwx" >> .env

      # ── 5.5 Gradle 缓存（用官方 gradle/actions，比手动 cache 更智能）──
      # setup-gradle 自动缓存: wrapper/caches/build-cache/configuration-cache
      # 并在 build-scan 中报告缓存命中情况
      - name: 🗄️ 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      # ── 5.6 缓存 Metro bundler ────────────────────────
      - name: ⚡ 缓存 Metro bundler
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.metro-cache
            ${{ github.workspace }}/node_modules/.cache/metro
          key: metro-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: metro-${{ runner.os }}-

      # ── 5.7 计算新版本号并更新 app.json（必须在 prebuild 前）──
      - name: 📋 计算并写入版本号
        id: version
        run: |
          VERSION=$(node -e "const a=require('./app.json'); console.log(a.expo.version)")
          MAJOR=$(echo $VERSION | awk -F. '{print $1}')
          MINOR=$(echo $VERSION | awk -F. '{print $2}')
          PATCH=$(echo $VERSION | awk -F. '{print $3}')
          NEW_CODE=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_CODE}"
          echo "name=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "code=${NEW_CODE}"    >> $GITHUB_OUTPUT
          echo "APK 版本: ${NEW_VERSION} (code: ${NEW_CODE})"

          # 把新版本写入 app.json，让 APK 内嵌正确版本号
          node -e "
            const fs = require('fs');
            const a  = JSON.parse(fs.readFileSync('app.json'));
            a.expo.version = '${NEW_VERSION}';
            a.expo.android = a.expo.android || {};
            a.expo.android.versionCode = ${NEW_CODE};
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2) + '\n');
            console.log('✅ app.json 已更新 →', '${NEW_VERSION}');
          "

      # ── 6. Expo Prebuild（生成 android 原生工程）───────
      - name: 🛠️ Expo Prebuild
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm exec expo prebuild --platform android --clean

      # ── 7. 写入 keystore 文件 ──────────────────────────
      - name: 🔐 恢复 keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/vehicle-app.keystore

      # ── 9. Gradle 构建 Release APK ─────────────────────
      - name: 🔨 Gradle 构建 APK
        # 必须在此步骤注入 env，Gradle 调用 Metro 打包时才能读到 EXPO_PUBLIC_* 变量
        # 若只写 .env 文件，Gradle/Metro 不会自动读取，导致 Supabase 用 placeholder
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ID: app-d6jn0ph0piwx
        run: |
          cd android
          chmod +x gradlew
          # JVM 优化：-Xms2g 预分配堆避免频繁扩容，GCTimeRatio=19 限制 GC 占用≤5%
          # workers.max=2：匹配 ubuntu-latest 的 2 vCPU，避免过度并发
          # configuration-cache：缓存配置阶段产物，第二次构建跳过配置 ~5min
          echo "org.gradle.jvmargs=-Xmx4g -Xms2g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:GCTimeRatio=19 -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.parallel=true"                     >> gradle.properties
          echo "org.gradle.configureondemand=true"            >> gradle.properties
          echo "org.gradle.caching=true"                      >> gradle.properties
          echo "org.gradle.workers.max=2"                     >> gradle.properties
          echo "org.gradle.configuration-cache=true"         >> gradle.properties
          echo "org.gradle.configuration-cache.problems=warn" >> gradle.properties
          ./gradlew assembleRelease --no-daemon --build-cache --parallel \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            -x lint

      # ── 10. 读取版本号（已在步骤 5.7 计算，这里只做复核日志）──
      - name: 📋 读取版本信息
        id: version_check
        run: |
          echo "✅ 版本确认: ${{ steps.version.outputs.name }} (code: ${{ steps.version.outputs.code }})"

      # ── 11. 发布 GitHub Release（APK 附件挂在 Release，GitHub→GitHub 极速）──
      - name: 🚀 发布 GitHub Release
        id: upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          VERSION_NAME="${{ steps.version.outputs.name }}"
          TAG="v${VERSION_NAME}"
          APK_ASSET="vehicle-app-${VERSION_NAME}.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK 不存在: $APK_PATH"
            exit 1
          fi
          echo "📦 APK 大小: $(du -sh $APK_PATH | cut -f1)"

          # 复制为带版本号的文件名
          cp "$APK_PATH" "$APK_ASSET"

          # 若同名 tag 已存在则删除（避免重复触发时冲突）
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --pretty=%s)"; fi

          # 创建 Release 并上传 APK（GitHub 内部网络，速度稳定）
          gh release create "$TAG" "$APK_ASSET" \
            --title "$TAG" \
            --notes "$NOTES"

          # 获取下载直链
          APK_URL=$(gh release view "$TAG" --json assets \
            --jq '.assets[0].browserDownloadUrl')
          echo "apk_url=${APK_URL}" >> $GITHUB_OUTPUT
          echo "✅ Release 发布成功: ${APK_URL}"

      # ── 12. 写入 app_versions 表 ──────────────────────
      - name: 📝 写入版本记录
        run: |
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="$(git log -1 --pretty=%s)"
          fi

          curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/app_versions" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{
              \"version_name\": \"${{ steps.version.outputs.name }}\",
              \"version_code\": ${{ steps.version.outputs.code }},
              \"apk_url\": \"${{ steps.upload.outputs.apk_url }}\",
              \"release_notes\": \"${NOTES}\",
              \"is_force\": false
            }"
          echo "✅ 版本记录写入完成"

      # ── 13. 保存 APK 产物 ──────────────────────────────
      - name: 💾 保存 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-app-${{ steps.version.outputs.name }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── 14. 构建完成通知 ───────────────────────────────
      - name: 🎉 构建完成
        run: |
          echo "================================================"
          echo "🎉 APK 构建发布成功！"
          echo "   版本：${{ steps.version.outputs.name }}"
          echo "   下载：${{ steps.upload.outputs.apk_url }}"
          echo "   App 内更新弹窗将在下次启动后自动弹出"
          echo "================================================"

      # ── 15. 把版本号回写到 GitHub（下次构建用）──────────
      - name: 🔖 回写版本号到 GitHub
        if: success()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add app.json
          if git diff --staged --quiet; then
            echo "⚠️ app.json 无变化，跳过回写"
          else
            git commit -m "ci: bump version to ${{ steps.version.outputs.name }} [skip ci]"
            # pull --rebase 合并远端新提交（避免并发推送冲突），再 push
            git pull --rebase origin main
            git push origin main
            echo "✅ app.json 版本已回写: ${{ steps.version.outputs.name }}"
          fi
